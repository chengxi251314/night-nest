<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>剧本角色模拟器</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .sim-layout{display:grid;grid-template-columns:1.02fr .98fr;gap:20px}.sim-stack{display:grid;gap:20px}.sim-textarea{width:100%;min-height:320px;padding:18px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:rgba(7,8,20,.92);color:#f5f1ff;line-height:1.8;resize:vertical;box-sizing:border-box}.sim-chatbox{min-height:360px;display:grid;gap:12px;align-content:start}.sim-bubble{max-width:88%;padding:14px 16px;border-radius:18px;line-height:1.8}.sim-bubble.system{max-width:100%;background:rgba(255,215,138,.08);color:#ffd78a}.sim-bubble.character{background:rgba(255,255,255,.05);color:#f5f1ff}.sim-bubble.user{justify-self:end;background:rgba(142,114,255,.18);color:#f5f1ff}.sim-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sim-field{display:grid;gap:8px}.sim-tags{display:flex;gap:10px;flex-wrap:wrap}.sim-tag-btn{cursor:pointer}.sim-input-actions{display:flex;gap:12px;flex-wrap:wrap}.sim-mini{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px}.sim-kicker{color:#ffd78a;margin:0 0 8px}.sim-wide{grid-column:1/-1}.sim-actions a,.sim-actions button{display:inline-flex;align-items:center;justify-content:center}@media (max-width:980px){.sim-layout{grid-template-columns:1fr}.sim-grid-2{grid-template-columns:1fr}}
  </style>
</head>
<body data-page="simulator">
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="logo">剧</div><div class="brand-copy"><small>SCRIPT SIMULATOR</small><h1>剧本角色模拟器</h1></div></div>
      <nav class="nav"><a href="index.html">首页</a><a href="simulator.html">模拟器</a><a href="chat.html">聊天展示</a><a href="characters.html">角色库</a></nav>
    </header>

    <section class="panel" style="margin-bottom:20px">
      <div class="kicker">Standalone Local Version</div>
      <h2 class="hero-title" style="font-size:36px">这版不需要启动服务，<br/>双击文件就能打开。</h2>
      <p class="hero-sub">把剧本贴进来，自动抽角色、关系、说话方式，再直接进入试玩。适合你先验证“剧本 -> 角色卡 -> 文字游戏模拟”这条链路。</p>
      <div class="actions sim-actions">
        <button class="btn btn-primary" id="load-sample">载入示例剧本</button>
        <button class="btn btn-secondary" id="generate-btn">生成角色模拟</button>
        <button class="btn btn-tertiary" id="copy-json">复制角色卡 JSON</button>
      </div>
    </section>

    <section class="sim-layout">
      <div class="sim-stack">
        <article class="panel">
          <div class="section-title" style="margin-top:0"><h2>1. 贴入剧本</h2></div>
          <p class="muted">支持“角色设定 + 场景描述 + 台词”混合文本。</p>
          <textarea id="script-input" class="sim-textarea"></textarea>
        </article>

        <article class="panel">
          <div class="section-title" style="margin-top:0"><h2>2. 剧本分析结果</h2></div>
          <div class="sim-grid-2">
            <div class="sim-mini"><p class="sim-kicker">标题</p><strong id="project-title">-</strong></div>
            <div class="sim-mini"><p class="sim-kicker">世界</p><strong id="project-world">-</strong></div>
            <div class="sim-mini"><p class="sim-kicker">场景</p><strong id="project-scene">-</strong></div>
            <div class="sim-mini"><p class="sim-kicker">气氛</p><strong id="project-tension">-</strong></div>
            <div class="sim-mini sim-wide"><p class="sim-kicker">剧情摘要</p><div class="muted" id="project-synopsis"></div></div>
          </div>
          <div class="sim-field" style="margin-top:16px">
            <p class="sim-kicker">主题标签</p>
            <div id="theme-list" class="sim-tags"></div>
          </div>
          <div class="sim-field" style="margin-top:16px">
            <p class="sim-kicker">已识别角色</p>
            <div id="character-switches" class="sim-tags"></div>
          </div>
        </article>
      </div>

      <div class="sim-stack">
        <article class="panel">
          <div class="section-title" style="margin-top:0"><h2>3. 角色卡</h2></div>
          <div id="character-card"></div>
        </article>

        <article class="panel">
          <div class="section-title" style="margin-top:0"><h2>4. 开始试玩</h2></div>
          <div class="hero-banner" id="active-label">当前未选择角色</div>
          <div class="panel sim-chatbox" id="chat-box" style="margin-top:12px"></div>
          <textarea id="chat-input" class="sim-textarea" style="min-height:110px" placeholder="比如：你为什么总想替我做决定？"></textarea>
          <div class="sim-input-actions">
            <button class="btn btn-secondary sim-tag-btn" data-prompt="你为什么总想替我做决定？">你为什么总想替我做决定？</button>
            <button class="btn btn-secondary sim-tag-btn" data-prompt="如果我现在需要你，你会站哪边？">如果我现在需要你，你会站哪边？</button>
            <button class="btn btn-secondary sim-tag-btn" data-prompt="把真相告诉我。">把真相告诉我。</button>
            <button class="btn btn-primary" id="send-btn">发送并生成回复</button>
          </div>
        </article>
      </div>
    </section>
  </div>

  <script>
    const sampleScript = `剧本标题：雨夜归航

世界设定：近未来海港城，财团与地下运输组织共同控制夜间航线。
剧情摘要：一批失踪货物牵出旧案。林雾必须在信任、真相与自保之间做选择。

角色：
- 林雾：女，情报贩子，冷静、敏锐、嘴硬心软，最讨厌被人擅自保护。
- 迟砚：男，夜航队长，寡言、克制、责任感强，对林雾有明显保护欲。
- 周既白：男，财团顾问，优雅、危险、擅长试探，永远在笑却不说真话。

第一场：码头仓库，暴雨未停。

林雾：你迟到了七分钟。
迟砚：风太大，回来的路封了两条。
林雾：借口不错，但我只看结果。
迟砚：结果是，我还是把你要的东西带回来了。
林雾：我不需要你每次都替我挡风险。
迟砚：可你每次都站在最前面。
周既白：两位，要吵可以，先告诉我，谁把账本从财团保险柜里拿出来了？
林雾：你笑得这么从容，看来你不是来问问题，是来验收答案。
周既白：我只是好奇，你这次会先怀疑我，还是先相信他。
迟砚：离她远点。
林雾：都闭嘴。今晚谁都别替我做决定。`;

    const traitRules = [
      { keywords: ["冷静", "沉着", "镇定"], trait: "冷静" },
      { keywords: ["敏锐", "观察", "洞察"], trait: "敏锐" },
      { keywords: ["嘴硬", "不承认", "逞强"], trait: "嘴硬心软" },
      { keywords: ["保护", "挡风险", "照顾"], trait: "保护欲强" },
      { keywords: ["寡言", "少说", "沉默"], trait: "克制寡言" },
      { keywords: ["优雅", "从容", "笑"], trait: "优雅危险" },
      { keywords: ["试探", "怀疑", "布局"], trait: "善于试探" },
      { keywords: ["责任", "必须", "不能失手"], trait: "责任感强" },
      { keywords: ["自由", "自己决定", "别替我做决定"], trait: "强烈自主" },
      { keywords: ["真相", "账本", "秘密"], trait: "追索真相" }
    ];

    const state = { project: null, activeId: "", messages: [] };

    const $ = (id) => document.getElementById(id);
    const unique = (items) => [...new Set(items)];
    const esc = (text) => String(text).replace(/[&<>\"]/g, (s) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[s]));

    function slugify(name) {
      return name.trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-").replace(/^-+|-+$/g, "") || "character";
    }

    function pickTopTraits(text) {
      const found = traitRules.filter(rule => rule.keywords.some(keyword => text.includes(keyword))).map(rule => rule.trait);
      const fallback = text.includes("？") || text.includes("?") ? ["善于博弈"] : ["情绪内敛"];
      return unique([...found, ...fallback]).slice(0, 4);
    }

    function inferSpeakingStyle(lines) {
      const merged = lines.join(" ");
      const shortLines = lines.filter(line => line.length <= 16).length;
      const questionMarks = (merged.match(/[？?]/g) || []).length;
      const exclamations = (merged.match(/[！!]/g) || []).length;
      if (shortLines >= Math.max(2, Math.ceil(lines.length / 2))) return "短句、克制、重点明确";
      if (questionMarks >= 2) return "擅长反问、喜欢把主动权握在手里";
      if (exclamations >= 2) return "情绪外放、推进感强";
      return "语气稳定，带一点试探和观察";
    }

    function inferMotivation(name, lines) {
      const text = lines.join(" ");
      if (text.includes("真相") || text.includes("账本")) return `${name}想尽快拿到真相并控制局面。`;
      if (text.includes("保护") || text.includes("挡风险") || text.includes("离她远点")) return `${name}的核心目标是保护在意的人不受伤。`;
      if (text.includes("决定") || text.includes("相信") || text.includes("怀疑")) return `${name}想把主动权牢牢握在自己手里。`;
      return `${name}希望在局势失控前先看清人心和筹码。`;
    }

    function inferTaboos(text) {
      const items = [];
      if (text.includes("别替我做决定") || text.includes("不需要你")) items.push("厌恶别人越界替自己做决定");
      if (text.includes("怀疑")) items.push("反感被轻易定义立场");
      if (text.includes("笑") && text.includes("真话")) items.push("不接受虚伪和半真半假的试探");
      return items.length ? items : ["不愿意暴露真正软肋"];
    }

    function inferTriggers(text) {
      const items = [];
      if (text.includes("迟到") || text.includes("结果")) items.push("对失约、低效率和失控很敏感");
      if (text.includes("保护") || text.includes("风险")) items.push("遇到危险时会迅速进入防御状态");
      if (text.includes("相信") || text.includes("怀疑")) items.push("信任话题会直接牵动情绪和判断");
      return items.length ? items : ["一旦被试探就会提高警惕"];
    }

    function inferSecrets(name, text) {
      if (text.includes("保护") || text.includes("离她远点")) return [`${name}对目标人物的在意已经超过普通合作关系。`];
      if (text.includes("笑") || text.includes("验收答案")) return [`${name}大概率早已掌握部分真相，只是在观察谁会先失手。`];
      return [`${name}隐藏了真正的底牌，不会第一时间交代。`];
    }

    function inferRole(name, rawScript) {
      const introLine = rawScript.split(/\r?\n/).find(line => line.includes(name) && /^[\-•]/.test(line.trim()));
      if (introLine) {
        const cleaned = introLine.replace(/^[\-•]\s*/, "");
        const fragments = cleaned.split(/[：:]/);
        return fragments.length > 1 ? fragments[1].split("，")[0].trim() : "关键角色";
      }
      return "关键角色";
    }

    function buildRelationships(name, names, lines) {
      const merged = lines.join(" ");
      return names.filter(target => target !== name).filter(target => merged.includes(target)).map(target => ({
        target,
        summary: merged.includes("相信") || merged.includes("怀疑") ? `和${target}之间存在明显的不信任与拉扯。` : `和${target}之间有持续博弈，也有未说破的在意。`,
        intensity: Math.min(95, 45 + merged.split(target).length * 12)
      }));
    }

    function extractProject(script) {
      const cleanScript = script.trim();
      const lines = cleanScript.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      const title = (lines.find(line => /剧本标题|标题/.test(line)) || "").split(/[：:]/)[1]?.trim() || "未命名剧本";
      const world = (lines.find(line => /世界设定|背景/.test(line)) || "").split(/[：:]/)[1]?.trim() || "世界观待补充";
      const synopsis = (lines.find(line => /剧情摘要|梗概/.test(line)) || "").split(/[：:]/)[1]?.trim() || lines.slice(0,4).join(" ");
      const sceneTitle = lines.find(line => /^第.+场/.test(line) || /场景/.test(line)) || "当前场景";
      const dialoguePattern = /^([A-Za-z\u4e00-\u9fa5·]{2,12})[：:](.+)$/;
      const dialogueMap = new Map();

      lines.forEach(line => {
        const match = line.match(dialoguePattern);
        if (!match) return;
        const [, name, content] = match;
        const current = dialogueMap.get(name) || { name, lines: [] };
        current.lines.push(content.trim());
        dialogueMap.set(name, current);
      });

      const names = [...dialogueMap.keys()];
      const characters = [...dialogueMap.values()].map(bucket => {
        const merged = bucket.lines.join(" ");
        const speakingStyle = inferSpeakingStyle(bucket.lines);
        return {
          id: slugify(bucket.name),
          name: bucket.name,
          role: inferRole(bucket.name, cleanScript),
          corePersonality: pickTopTraits(`${cleanScript} ${merged}`),
          speakingStyle,
          motivation: inferMotivation(bucket.name, bucket.lines),
          taboos: inferTaboos(merged),
          emotionalTriggers: inferTriggers(merged),
          secrets: inferSecrets(bucket.name, merged),
          sampleLines: bucket.lines.slice(0, 3),
          relationships: buildRelationships(bucket.name, names, bucket.lines)
        };
      });

      const themes = unique([
        cleanScript.includes("真相") ? "真相" : "",
        cleanScript.includes("信任") ? "信任" : "",
        cleanScript.includes("保护") ? "保护与越界" : "",
        cleanScript.includes("账本") ? "利益博弈" : "",
        cleanScript.includes("决定") ? "控制权" : ""
      ].filter(Boolean));

      return {
        title,
        synopsis,
        world,
        themes: themes.length ? themes : ["人物关系", "情绪拉扯"],
        characters,
        scene: {
          title: sceneTitle,
          summary: synopsis,
          currentBeat: characters[0] ? `${characters[0].name}正在试图掌握对话主动权。` : "角色尚未生成。",
          tension: cleanScript.includes("暴雨") || cleanScript.includes("危险") ? "高压、悬疑、随时可能翻盘" : "关系试探持续升温"
        }
      };
    }

    function inferUserIntent(message) {
      if (/(喜欢|在意|爱|想你)/.test(message)) return "情感确认";
      if (/(为什么|怎么|真相|秘密)/.test(message)) return "追问真相";
      if (/(帮我|救我|保护|陪我|需要你)/.test(message)) return "寻求依靠";
      if (/(不信|怀疑|骗我)/.test(message)) return "质疑试探";
      return "日常推进";
    }

    function inferMood(character, userMessage) {
      if (/(别|走开|烦|闭嘴)/.test(userMessage)) return "被冒犯后的冷硬";
      if (/(帮我|陪我|需要你)/.test(userMessage)) return "被需要后的松动";
      if (/(为什么|真相|秘密)/.test(userMessage)) return "警惕中的坦白边缘";
      if (character.corePersonality.includes("优雅危险")) return "从容试探";
      if (character.corePersonality.includes("保护欲强")) return "克制保护";
      return "稳定观察";
    }

    function styleLead(character, mood) {
      if (character.speakingStyle.includes("短句")) return mood.includes("冷硬") ? "先别激我。" : "我在听。";
      if (character.speakingStyle.includes("反问")) return mood.includes("坦白") ? "你确定现在就要答案？" : "你是在试探我，还是想听真话？";
      if (character.speakingStyle.includes("情绪外放")) return "你这样说，我很难当作没听见。";
      return "我知道你这句话不只是表面意思。";
    }

    function relationshipNudge(project, character) {
      const closest = [...character.relationships].sort((a, b) => b.intensity - a.intensity)[0];
      if (!closest) return `现在的重点不是场面，而是${character.name}心里那条底线。`;
      return `${character.name}和${closest.target}之间的张力还在，任何一句话都可能把局面推向另一边。`;
    }

    function openingMessages(project, character) {
      return [
        { role: "system", text: `已载入《${project.title}》模拟。当前场景：${project.scene.title}。氛围：${project.scene.tension}。` },
        { role: "character", text: `${styleLead(character, "稳定观察")}我是${character.name}。${character.motivation}` }
      ];
    }

    function generateReply(project, character, userMessage, history) {
      const mood = inferMood(character, userMessage);
      const intent = inferUserIntent(userMessage);
      const lead = styleLead(character, mood);
      const trait = character.corePersonality[0] || "情绪内敛";
      const secret = character.secrets[0] || `${character.name}没有把真正想法说满。`;
      const taboo = character.taboos[0] || "不要逼我马上表态。";
      const lastUserTurns = history.filter(item => item.role === "user").slice(-2).map(item => item.text).join(" ");
      let body = "";
      switch (intent) {
        case "情感确认":
          body = `${lead}如果你要的是态度，我不会装作无所谓。只是我更在意你说完这句话之后，会不会真的留下来。`;
          break;
        case "追问真相":
          body = `${lead}真相我不是不能给你，只是现在每多说一句，都可能让局面提前失控。${secret}`;
          break;
        case "寻求依靠":
          body = `${lead}你可以靠过来，但别把这当成软弱。对我来说，接住你本来就是一种选择。`;
          break;
        case "质疑试探":
          body = `${lead}你有资格怀疑我，但别用最轻率的方式下结论。${taboo}。`;
          break;
        default:
          body = `${lead}你现在的语气我记住了。以${character.name}这种${trait}的人来说，这种时候不会轻易给空话，只会先看你真正想推进到哪一步。`;
      }
      const follow = lastUserTurns && intent !== "日常推进"
        ? `刚才你提到“${lastUserTurns.slice(-16)}”，这已经足够让我重新判断我们之间的距离。`
        : relationshipNudge(project, character);
      return { role: "character", text: `${body} ${follow}` };
    }

    function tag(label, active = false, button = false, dataId = "") {
      const cls = active ? 'btn btn-secondary' : 'btn btn-tertiary';
      return button ? `<button class="${cls} sim-tag-btn" data-id="${esc(dataId)}">${esc(label)}</button>` : `<span class="${cls}">${esc(label)}</span>`;
    }

    function currentCharacter() {
      return state.project?.characters.find(item => item.id === state.activeId) || state.project?.characters[0] || null;
    }

    function renderProject() {
      const project = state.project;
      if (!project) return;
      $("project-title").textContent = project.title;
      $("project-world").textContent = project.world;
      $("project-scene").textContent = project.scene.title;
      $("project-tension").textContent = project.scene.tension;
      $("project-synopsis").textContent = project.synopsis;
      $("theme-list").innerHTML = project.themes.map(theme => tag(theme, true)).join("");
      $("character-switches").innerHTML = project.characters.map(character => tag(character.name, character.id === state.activeId, true, character.id)).join("");
      Array.from(document.querySelectorAll('#character-switches [data-id]')).forEach(button => {
        button.addEventListener('click', () => switchCharacter(button.dataset.id));
      });
      renderCharacterCard();
      renderChat();
    }

    function renderCharacterCard() {
      const character = currentCharacter();
      $("active-label").textContent = character ? `当前扮演：${character.name}` : '当前未选择角色';
      if (!character) {
        $("character-card").innerHTML = '<p class="muted">还没有识别到角色，请补一点对白或角色设定。</p>';
        return;
      }
      const relationshipHtml = character.relationships.length
        ? character.relationships.map(item => `<div class="sim-mini"><strong>${esc(item.target)}</strong><div class="muted">${esc(item.summary)}</div></div>`).join('')
        : '<p class="muted">当前对白里还没有足够关系证据。</p>';
      $("character-card").innerHTML = `
        <p class="sim-kicker">${esc(character.role)}</p>
        <h3 style="font-size:28px;margin:8px 0 16px">${esc(character.name)}</h3>
        <div class="sim-field"><p class="sim-kicker">核心性格</p><div class="sim-tags">${character.corePersonality.map(item => tag(item)).join('')}</div></div>
        <div class="sim-field"><p class="sim-kicker">说话方式</p><div class="muted">${esc(character.speakingStyle)}</div></div>
        <div class="sim-field"><p class="sim-kicker">角色动机</p><div class="muted">${esc(character.motivation)}</div></div>
        <div class="sim-field"><p class="sim-kicker">禁区</p><div class="sim-tags">${character.taboos.map(item => tag(item)).join('')}</div></div>
        <div class="sim-field"><p class="sim-kicker">情绪触发点</p><div class="sim-tags">${character.emotionalTriggers.map(item => tag(item)).join('')}</div></div>
        <div class="sim-field"><p class="sim-kicker">隐藏信息</p><div class="sim-tags">${character.secrets.map(item => tag(item)).join('')}</div></div>
        <div class="sim-field"><p class="sim-kicker">代表台词</p><div class="sim-tags">${character.sampleLines.map(item => tag(item)).join('')}</div></div>
        <div class="sim-field"><p class="sim-kicker">关系线索</p><div class="sim-grid-2">${relationshipHtml}</div></div>
      `;
    }

    function renderChat() {
      const box = $("chat-box");
      box.innerHTML = state.messages.map(message => `<div class="sim-bubble ${message.role}">${esc(message.text)}</div>`).join('');
    }

    function switchCharacter(id) {
      state.activeId = id;
      const character = currentCharacter();
      state.messages = character ? openingMessages(state.project, character) : [];
      renderProject();
    }

    function rebuild() {
      state.project = extractProject($("script-input").value);
      state.activeId = state.project.characters[0]?.id || "";
      const character = currentCharacter();
      state.messages = character ? openingMessages(state.project, character) : [];
      renderProject();
    }

    function sendMessage() {
      const character = currentCharacter();
      const input = $("chat-input");
      const text = input.value.trim();
      if (!text || !character) return;
      const userMessage = { role: "user", text };
      state.messages.push(userMessage);
      state.messages.push(generateReply(state.project, character, text, state.messages));
      input.value = "";
      renderChat();
    }

    document.addEventListener('click', (event) => {
      const button = event.target.closest('[data-prompt]');
      if (button) $("chat-input").value = button.dataset.prompt;
    });

    $("load-sample").addEventListener('click', () => { $("script-input").value = sampleScript; rebuild(); });
    $("generate-btn").addEventListener('click', rebuild);
    $("send-btn").addEventListener('click', sendMessage);
    $("copy-json").addEventListener('click', async () => {
      await navigator.clipboard.writeText(JSON.stringify(state.project, null, 2));
      const btn = $("copy-json");
      const old = btn.textContent;
      btn.textContent = '已复制 JSON';
      setTimeout(() => btn.textContent = old, 1600);
    });

    $("script-input").value = sampleScript;
    rebuild();
  </script>
</body>
</html>
